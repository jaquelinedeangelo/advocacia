<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jaqueline de Angelo Nascimento — OAB/MT 13.427</title>
  <meta name="description" content="Jaqueline de Angelo Nascimento — Advogada inscrita na OAB/MT sob o nº 13.427.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#1e3a5f">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #1e3a5f;
      --accent: #d4a574;
      --bg: #ffffff;
      --text: #1a1a1a;
      --text-muted: #6b6b6b;
      --border: rgba(30,58,95,0.12);
    }

    *,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 1.5rem;
    }

    .card {
      max-width: 760px;
      width: 100%;
      text-align: center;
      animation: fadeUp 0.9s ease 0.1s backwards;
    }

    .logo {
      display: block;
      width: 160px;
      height: auto;
      margin: 0 auto 2.5rem;
      animation: fadeUp 0.9s ease 0.05s backwards;
    }

    .name {
      font-family: 'Marcellus', Georgia, serif;
      font-weight: 400;
      font-size: clamp(1.5rem, 3.6vw, 2.25rem);
      line-height: 1.25;
      color: var(--primary);
      letter-spacing: 0.005em;
      margin-bottom: 1.5rem;
      animation: fadeUp 0.9s ease 0.25s backwards;
    }

    .divider {
      width: 36px;
      height: 1px;
      background: var(--accent);
      margin: 0 auto 1.25rem;
      animation: fadeUp 0.9s ease 0.4s backwards;
    }

    .oab {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-muted);
      animation: fadeUp 0.9s ease 0.5s backwards;
    }
    .oab strong { color: var(--primary); font-weight: 500; }

    footer {
      padding: 1.5rem;
      text-align: center;
      font-size: 0.78rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border);
      animation: fadeUp 0.9s ease 0.7s backwards;
    }
    footer p { max-width: 520px; margin: 0 auto; line-height: 1.55; }
  </style>
</head>
<body>

<main>
  <div class="card">
    <img src="logo.png" alt="Logo Jaqueline de Angelo Nascimento" class="logo">


    <h1 class="name">Jaqueline de Angelo Nascimento</h1>

    <div class="divider"></div>

    <div class="oab"><strong>OAB/MT</strong> 13.427</div>
  </div>
</main>

<footer>
  <p>Página informativa institucional, em conformidade com o Código de Ética e Disciplina da OAB e o Provimento nº 205/2021 do Conselho Federal da OAB.</p>
</footer>

</body>
</html>
